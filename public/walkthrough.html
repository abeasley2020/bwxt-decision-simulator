<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Operation Iron Horizon | Guided Walkthrough</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── Walkthrough chrome tokens (theme-aware) ─────────────────────────── */
  :root{
    --c-bg:#EDEDF1; --c-panel:#FFFFFF; --c-fg:#1B1A2E; --c-muted:#6E6C86;
    --c-line:#D8D7E4; --c-bar:#100E24; --c-bar-fg:#FFFFFF; --c-bar-muted:rgba(255,255,255,.62);
    --c-note-bg:#FBF3E2; --c-note-line:#E4C989; --c-note-fg:#6B4E11; --c-note-accent:#A97612;
    --c-focus:#4C6FFF;
  }
  @media (prefers-color-scheme: dark){
    :root{ --c-bg:#141320; --c-panel:#1E1C30; --c-fg:#ECEBF4; --c-muted:#9C9AB4;
      --c-line:#33314A; --c-bar:#0A0918; --c-note-bg:#2A2410; --c-note-line:#5C4A1A;
      --c-note-fg:#E8CF8E; --c-note-accent:#D9A93F; }
  }
  :root[data-theme="dark"]{ --c-bg:#141320; --c-panel:#1E1C30; --c-fg:#ECEBF4; --c-muted:#9C9AB4;
    --c-line:#33314A; --c-bar:#0A0918; --c-note-bg:#2A2410; --c-note-line:#5C4A1A;
    --c-note-fg:#E8CF8E; --c-note-accent:#D9A93F; }
  :root[data-theme="light"]{ --c-bg:#EDEDF1; --c-panel:#FFFFFF; --c-fg:#1B1A2E; --c-muted:#6E6C86;
    --c-line:#D8D7E4; --c-bar:#100E24; --c-note-bg:#FBF3E2; --c-note-line:#E4C989;
    --c-note-fg:#6B4E11; --c-note-accent:#A97612; }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--c-bg);color:var(--c-fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;padding-top:56px}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  /* ── Top chrome bar ──────────────────────────────────────────────────── */
  .bar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--c-bar);color:var(--c-bar-fg);
    display:flex;align-items:center;gap:12px;padding:0 14px;z-index:60;font-size:13px}
  .bar .brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .bar .brand small{display:block;font-weight:400;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--c-bar-muted)}
  .bar .mid{flex:1;text-align:center;color:var(--c-bar-muted);min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .bar .mid strong{color:var(--c-bar-fg);font-weight:600}
  .chip-btn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:var(--c-bar-fg);
    border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip-btn:hover{background:rgba(255,255,255,.2)}
  .chip-btn[aria-pressed="true"]{background:var(--c-note-accent);border-color:var(--c-note-accent);color:#171003}

  /* ── Screens menu drawer ─────────────────────────────────────────────── */
  .drawer{position:fixed;top:56px;right:0;bottom:0;width:310px;max-width:88vw;background:var(--c-panel);
    border-left:1px solid var(--c-line);z-index:55;overflow-y:auto;padding:14px;display:none;
    box-shadow:-8px 0 30px rgba(0,0,0,.18)}
  .drawer.open{display:block}
  .drawer h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-muted);
    margin:14px 4px 6px}
  .drawer button.jump{display:flex;width:100%;text-align:left;background:none;border:0;
    border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--c-fg);cursor:pointer;gap:9px;align-items:baseline}
  .drawer button.jump:hover{background:var(--c-bg)}
  .drawer button.jump[aria-current="true"]{background:var(--c-bg);font-weight:700}
  .drawer .num{font-size:11px;color:var(--c-muted);font-variant-numeric:tabular-nums;min-width:16px}

  /* ── Stage + walkthrough footer nav ──────────────────────────────────── */
  #stage{min-height:calc(100vh - 130px)}
  .wnav{max-width:880px;margin:0 auto;padding:22px 18px 60px;display:flex;justify-content:space-between;gap:12px}
  .wnav button{border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-fg);border-radius:10px;
    padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer}
  .wnav button:hover{border-color:var(--c-muted)}
  .wnav button:disabled{opacity:.35;cursor:not-allowed}

  /* ── Designer notes ──────────────────────────────────────────────────── */
  .note{display:none;background:var(--c-note-bg);border:1px solid var(--c-note-line);
    border-left:4px solid var(--c-note-accent);border-radius:10px;padding:13px 16px;margin:14px 0;
    color:var(--c-note-fg);font-size:13.5px;line-height:1.6}
  .note b.tag{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--c-note-accent);margin-bottom:5px}
  body.notes .note{display:block}
  .fx{display:none;flex-wrap:wrap;gap:5px;margin-top:9px}
  body.notes .fx{display:flex}
  .fx span{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;border-radius:5px;
    padding:2.5px 7px;border:1px solid;font-variant-numeric:tabular-nums}
  .fx .up{color:#1A6B4A;border-color:#9CCDB6;background:#EAF6F0}
  .fx .dn{color:#9E3039;border-color:#E3AEB4;background:#FBEFF0}
  .fx .sc{color:#17153A;border-color:#B9B7D6;background:#EEEDF7}
  .fx .tr{color:#6B4E11;border-color:#E4C989;background:#FBF3E2}

  /* ══ SIMULATOR SURFACE — fixed BWXT light design system, verbatim tokens ══ */
  .sim{--navy:#17153A;--navy-dark:#0E0C27;--navy-light:#EEEDF7;--crimson:#9E3039;--crimson-bright:#C93147;
    --crimson-light:#F5E6E8;--bg:#F4F4F7;--border:#E0DFF0;--t1:#17153A;--t2:#5A5880;--t3:#9896B0;
    --ok:#1A6B4A;--warn:#92600A;
    background:var(--bg);color:var(--t1);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .sim .serif{font-family:"Playfair Display",Georgia,"Times New Roman",serif}
  .sim .wrap{max-width:880px;margin:0 auto;padding:0 24px}
  .sim .wrap-n{max-width:760px;margin:0 auto;padding:0 24px}
  .sim .card{background:#fff;border:1px solid var(--border);border-radius:12px;
    box-shadow:0 1px 4px rgba(23,21,58,.06)}
  .sim h2.sec{font-size:18px;font-weight:600;color:var(--navy);margin:0 0 12px}
  .sim p.sub{font-size:15px;color:var(--t2);margin:-6px 0 16px}
  .sim .statusbar{background:var(--navy-light);border-bottom:1px solid var(--border)}
  .sim .statusbar .in{max-width:880px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;
    gap:12px;flex-wrap:wrap}
  .sim .pill{background:var(--crimson);color:#fff;font-size:12px;font-weight:600;padding:4px 12px;
    border-radius:999px;white-space:nowrap}
  .sim .statusbar .lbl{color:var(--t2);font-size:13px}
  .sim .statusbar .r{margin-left:auto;color:var(--t3);font-size:13px}
  .sim .btn{display:block;width:100%;max-width:440px;margin:0 auto;padding:14px;background:var(--navy);
    color:#fff;font-weight:600;font-size:15px;border:0;border-radius:14px;cursor:pointer;text-align:center}
  .sim .btn:hover{background:var(--navy-dark)}
  .sim .btn-hint{text-align:center;font-size:13px;color:var(--t3);margin-top:12px}
  .sim .eyebrow{font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--crimson-bright);
    text-transform:uppercase}
  .sim .kgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:640px){.sim .kgrid{grid-template-columns:repeat(4,1fr)}}
  .sim .kcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;
    box-shadow:0 1px 4px rgba(23,21,58,.06)}
  .sim .kcard .kl{font-size:12px;font-weight:500;color:var(--t3);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:8px}
  .sim .kcard .kv{font-size:28px;font-weight:600;color:var(--navy);line-height:1;margin-bottom:10px;
    font-variant-numeric:tabular-nums}
  .sim .track{height:4px;background:var(--border);border-radius:99px;overflow:hidden}
  .sim .track i{display:block;height:100%;background:var(--navy);border-radius:99px}
  .sim .track i.cr{background:var(--crimson)}
  .sim .delta{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;
    font-size:12px;font-weight:600;border:1px solid;font-variant-numeric:tabular-nums;margin-top:8px}
  .sim .delta.up{color:var(--ok);background:#EAF6F0;border-color:#BFE3D1}
  .sim .delta.dn{color:var(--crimson);background:var(--crimson-light);border-color:#E7C3C8}
  .sim .delta.eq{color:var(--t3);background:#F0F0F5;border-color:var(--border)}
  .sim .grid2{display:grid;gap:12px}
  @media(min-width:640px){.sim .grid2{grid-template-columns:1fr 1fr}}
  .sim .opt{display:flex;gap:12px;border:1px solid var(--border);border-radius:12px;padding:14px 16px;
    background:#fff;cursor:pointer;align-items:flex-start}
  .sim .opt:hover{border-color:var(--t3)}
  .sim .opt.on{border-color:var(--crimson);background:#FDF9F9;box-shadow:0 0 0 1px var(--crimson)}
  .sim .opt input{margin-top:3px;accent-color:var(--crimson);width:17px;height:17px;flex-shrink:0}
  .sim .opt .ol{font-weight:600;font-size:15px;color:var(--navy);line-height:1.4}
  .sim .opt .od{font-size:13px;color:var(--t2);line-height:1.55;margin-top:3px}
  .sim .dhead .dmeta{font-size:12px;font-weight:500;color:var(--t3);text-transform:uppercase;
    letter-spacing:.04em;margin-bottom:4px}
  .sim .dhead h3{font-size:16px;font-weight:600;color:var(--navy);margin:0 0 8px;line-height:1.4}
  .sim .dhead .dprompt{font-size:15px;color:var(--t2);line-height:1.65;margin:0 0 16px}
  .sim .err{color:var(--crimson);font-size:14px;margin-top:10px;font-weight:500}
  .sim .dsec{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;
    box-shadow:0 1px 4px rgba(23,21,58,.06)}
  .sim .dsec.bad{border-color:var(--crimson)}
  .sim table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
  .sim th{background:var(--navy-light);text-align:center;padding:12px;font-size:12px;font-weight:500;
    color:var(--t3);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
  .sim th:first-child{text-align:left;padding-left:16px}
  .sim td{padding:12px;text-align:center;border-bottom:1px solid var(--border);
    font-variant-numeric:tabular-nums;font-weight:600;color:var(--navy)}
  .sim td:first-child{text-align:left;padding-left:16px;font-weight:500}
  .sim td .tup{color:var(--ok);font-size:12px;margin-left:4px}
  .sim td .tdn{color:var(--crimson);font-size:12px;margin-left:4px}
  .sim textarea,.sim input[type=number],.sim input[type=email]{width:100%;border:1px solid var(--border);
    border-radius:8px;padding:10px 12px;font-size:15px;color:var(--navy);font-family:inherit;background:#fff}
  .sim textarea:focus,.sim input:focus{outline:none;border-color:var(--crimson);
    box-shadow:0 0 0 1px var(--crimson)}
  .sim .alloc-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;
    border:1px solid var(--border);border-radius:12px;padding:16px;background:#fff;margin-bottom:12px}
  .sim .alloc-row input{width:64px;text-align:right;font-weight:600;padding:6px 8px}
  .sim .alloc-total{display:flex;justify-content:space-between;padding:12px 16px;border-radius:12px;
    border:1px solid;font-size:15px}
  .sim .alloc-total.ok{background:#EAF6F0;border-color:#BFE3D1}
  .sim .alloc-total.under{background:#FDF6E7;border-color:#EAD49A}
  .sim .alloc-total.over{background:var(--crimson-light);border-color:#E7C3C8}
  .sim .stake{display:flex;gap:12px}
  .sim .stake .av{width:32px;height:32px;border-radius:99px;background:var(--navy-light);color:var(--navy);
    font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sim .facnav{background:var(--navy);color:#fff}
  .sim .facnav .in{max-width:1100px;margin:0 auto;padding:0 24px;display:flex;gap:4px;align-items:center;
    height:52px;font-size:13.5px;overflow-x:auto}
  .sim .facnav .fbrand{font-weight:700;margin-right:18px;white-space:nowrap}
  .sim .facnav a{color:rgba(255,255,255,.72);padding:6px 12px;border-radius:8px;white-space:nowrap;
    text-decoration:none}
  .sim .facnav a.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
  .sim .wrapw{max-width:1100px;margin:0 auto;padding:0 24px}
  .sim .demo-tag{display:inline-flex;align-items:center;gap:6px;background:#FDF6E7;border:1px solid #EAD49A;
    color:#92600A;font-size:12px;font-weight:600;border-radius:999px;padding:4px 12px}
  .sim .pbar{display:flex;height:26px;border-radius:8px;overflow:hidden;border:1px solid var(--border);
    font-size:11px;color:#fff;font-weight:600}
  .sim .youchip{display:inline-block;background:var(--crimson);color:#fff;border-radius:5px;
    font-size:10px;font-weight:700;padding:1.5px 7px;letter-spacing:.05em;margin-left:8px;vertical-align:1px}
  .sim .radio5{display:flex;flex-wrap:wrap;gap:14px}
  .sim .radio5 label{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
    font-size:12px;color:var(--t3)}
  .sim .radio5 b{color:var(--navy);font-size:12px;font-variant-numeric:tabular-nums}
  .sim .fieldset{border:0;border-bottom:1px solid var(--border);margin:0 0 22px;padding:0 0 22px}
  .sim .fieldset:last-of-type{border-bottom:0;margin-bottom:0;padding-bottom:0}
  .sim .fieldset legend,.sim .flabel{font-size:15px;font-weight:500;color:var(--navy);margin-bottom:12px;
    padding:0}
  .scrollx{overflow-x:auto}

  /* intro cover */
  .cover{max-width:820px;margin:0 auto;padding:60px 24px 30px}
  .cover .kick{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--c-note-accent);
    font-weight:700;margin-bottom:16px}
  .cover h1{font-family:Georgia,serif;font-size:clamp(30px,5vw,46px);line-height:1.12;margin:0 0 18px;
    text-wrap:balance}
  .cover p.lede{font-size:17px;line-height:1.65;color:var(--c-muted);max-width:60ch}
  .cover .acts{display:grid;gap:12px;margin:30px 0}
  @media(min-width:640px){.cover .acts{grid-template-columns:1fr 1fr}}
  .cover .act{background:var(--c-panel);border:1px solid var(--c-line);border-radius:12px;padding:18px 20px}
  .cover .act b{display:block;margin-bottom:6px;font-size:15px}
  .cover .act p{margin:0;font-size:13.5px;color:var(--c-muted);line-height:1.55}
  .cover ul.tips{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.8;color:var(--c-muted)}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img,svg{max-width:100%}</style>
</head>
<body>
<div class="bar" role="banner">
  <div class="brand">Iron Horizon<small>Guided walkthrough</small></div>
  <div class="mid" id="barMid"></div>
  <button class="chip-btn" id="notesBtn" aria-pressed="false" title="Toggle designer annotations">✎ Designer notes</button>
  <button class="chip-btn" id="menuBtn" aria-expanded="false">Screens ▾</button>
  <button class="chip-btn" id="resetBtn" title="Clear your choices and start over">↺ Restart</button>
</div>
<nav class="drawer" id="drawer" aria-label="Jump to screen"></nav>
<div id="stage"></div>
<div class="wnav">
  <button id="prevBtn">← Back</button>
  <button id="nextBtn">Continue →</button>
</div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════
   AUTHORED CONTENT — transcribed verbatim from src/content/iron-horizon/
   ════════════════════════════════════════════════════════════════════════ */
const KPIS=[
 {k:"decision_velocity",l:"Decision Velocity",d:"Speed and decisiveness of leadership choices",s:60},
 {k:"safety_compliance_confidence",l:"Safety & Compliance Confidence",d:"Regulatory and safety posture strength",s:70},
 {k:"financial_performance_outlook",l:"Financial Performance Outlook",d:"Near-term and long-term financial health trajectory",s:65},
 {k:"operational_throughput",l:"Operational Throughput",d:"Production capacity and delivery reliability",s:65},
 {k:"talent_readiness",l:"Talent Readiness",d:"Workforce capability and succession depth",s:55},
 {k:"digital_maturity",l:"Digital Maturity",d:"Technology adoption and data-driven operations",s:45},
 {k:"cross_functional_alignment",l:"Cross-Functional Alignment",d:"Organizational cohesion and shared strategic direction",s:60},
 {k:"executive_confidence",l:"Executive Confidence",d:"Board and senior leadership confidence in direction",s:65}];
const DIMS=[
 {k:"enterprise_judgment",l:"Enterprise Judgment",d:"Balances short-term pressure with long-term strategic positioning across the enterprise"},
 {k:"decision_velocity_with_discipline",l:"Decision Velocity with Discipline",d:"Makes timely, clear decisions without sacrificing analysis or rigor"},
 {k:"financial_strategic_acumen",l:"Financial & Strategic Acumen",d:"Allocates capital and resources with strategic precision and financial literacy"},
 {k:"technology_data_leadership",l:"Technology & Data Leadership",d:"Drives digital transformation with governance and appropriate risk tolerance"},
 {k:"talent_leadership",l:"Talent Leadership",d:"Builds, develops, and retains the capabilities the organization requires"},
 {k:"communication_alignment",l:"Communication & Alignment",d:"Creates clarity, trust, and organizational momentum through communication"},
 {k:"continuous_improvement_orientation",l:"Continuous Improvement Orientation",d:"Learns from outcomes, adapts, and improves the operating model over time"}];
const KL=Object.fromEntries(KPIS.map(x=>[x.k,x.l])), DL=Object.fromEntries(DIMS.map(x=>[x.k,x.l]));

/* fx tuples: ["k"|"s"|"t", targetKey, value] */
const ROUNDS=[
{n:1,title:"Set Direction",
 brief:["It's Day 1. You've received your first executive briefing.","Key facts:","- Q1 revenue is tracking 6% below plan due to delayed defense contract closeouts","- The Safety & Compliance team has flagged two open non-conformances ahead of the audit","- Digital Transformation Program is requesting an emergency budget increase of $12M","- Your Head of Operations has tendered a conditional resignation — she will stay if given expanded authority","The Board expects a clear direction memo within 72 hours.","You must make four decisions now."],
 event:"The Board's Operating Committee has convened an emergency call. They want to know: What are your top priorities for the next 90 days, and how are you allocating the available discretionary budget of $20M?",
 decisions:[
 {k:"r1_prioritization",t:"90-Day Priority Focus",type:"multi",min:2,max:2,
  p:"Select your top two priorities for the next 90 days. Your choices will shape resource allocation, communication, and operating rhythm across the division.",
  opts:[
  {k:"r1_pri_revenue",l:"Recover revenue gap",d:"Close the $145M defense contract backlog and restore Q1 run rate. Focus sales and delivery teams on near-term contract closeouts.",fx:[["k","financial_performance_outlook",8],["k","decision_velocity",5],["s","financial_strategic_acumen",3],["s","enterprise_judgment",2]]},
  {k:"r1_pri_compliance",l:"Resolve compliance risk",d:"Address the two open non-conformances and pre-position for the audit. Assign a senior task force and freeze changes to affected processes.",fx:[["k","safety_compliance_confidence",12],["k","executive_confidence",5],["s","enterprise_judgment",4],["t","compliance_first_leader",1]]},
  {k:"r1_pri_digital",l:"Accelerate digital transformation",d:"Prioritize the lagging DX program by assigning executive sponsorship and clearing blockers. Accept short-term cost to capture long-term capability.",fx:[["k","digital_maturity",10],["s","technology_data_leadership",5],["s","enterprise_judgment",1],["t","digital_first_leader",1]]},
  {k:"r1_pri_talent",l:"Stabilize the leadership team",d:"Immediately address the retention risk with your Head of Operations and the two other at-risk direct reports before any other initiative can succeed.",fx:[["k","talent_readiness",10],["k","cross_functional_alignment",6],["s","talent_leadership",5],["t","people_first_leader",1]]},
  {k:"r1_pri_ops",l:"Improve operational throughput",d:"Focus on removing production bottlenecks and improving on-time delivery metrics before addressing anything else.",fx:[["k","operational_throughput",9],["k","financial_performance_outlook",4],["s","financial_strategic_acumen",2]]}]},
 {k:"r1_capital",t:"Discretionary Budget Allocation",type:"alloc",
  p:"You have $20M in discretionary budget to allocate across four areas. Distribute it as you see fit. Your allocation signals what you value and where you are placing your bets.",
  opts:[
  {k:"r1_cap_compliance",l:"Safety & Compliance remediation",d:"Audit readiness, non-conformance resolution, and process hardening.",fx:[["k","safety_compliance_confidence",15],["s","enterprise_judgment",2]]},
  {k:"r1_cap_digital",l:"Digital Transformation Program",d:"Accelerate the lagging DX program milestones.",fx:[["k","digital_maturity",15],["s","technology_data_leadership",3]]},
  {k:"r1_cap_talent",l:"Talent retention and development",d:"Retention packages, succession planning, leadership coaching.",fx:[["k","talent_readiness",15],["s","talent_leadership",3]]},
  {k:"r1_cap_ops",l:"Operational capacity investment",d:"Equipment, tooling, and capacity upgrades to reduce throughput constraints.",fx:[["k","operational_throughput",15],["s","financial_strategic_acumen",2]]}]},
 {k:"r1_talent_hoo",t:"Head of Operations: Retention Decision",type:"single",

const clamp=v=>Math.min(100,Math.max(0,v));
function initKPIs(){const o={};KPIS.forEach(x=>o[x.k]=x.s);return o}
function initScores(){const o={};DIMS.forEach(x=>o[x.k]=0);return o}
/* Apply one round's responses. resp: {decisionKey:{sel:[keys], alloc:{key:pct}}} */
function applyRound(round,resp,kpis,scores){
  const K={...kpis},S={...scores},T=[];
  for(const d of round.decisions){
    const r=resp[d.k]; if(!r)continue;
    const chosen=d.type==="alloc"?d.opts:d.opts.filter(o=>r.sel.includes(o.k));
    for(const o of chosen){
      for(const [ty,tk,val] of o.fx){
        let v=val;
        if(d.type==="alloc"&&r.alloc){v=val*((r.alloc[o.k]||0)/100)}
        if(ty==="k")K[tk]=clamp(K[tk]+v);
        else if(ty==="s")S[tk]=S[tk]+v;
        else if(ty==="t"&&v>0)T.push(tk);
      }
    }
  }
  return{K,S,T};
}
/* Profile assignment — priority-ordered, first match wins; fallback by top dimension */
function ruleMatches(g,kpis,scores,traits){
  if(g.st)for(const k in g.st)if((scores[k]??0)<g.st[k])return false;
  if(g.sc)for(const k in g.sc)if((scores[k]??0)>g.sc[k])return false;
  if(g.kt)for(const k in g.kt)if((kpis[k]??0)<g.kt[k])return false;
  if(g.rt)for(const t of g.rt)if(!traits.includes(t))return false;
  if(g.dd&&g.dd.length){
    const dset=new Set(g.dd);
    const dAvg=g.dd.reduce((s,k)=>s+(scores[k]??0),0)/g.dd.length;
    const rest=Object.keys(scores).filter(k=>!dset.has(k));
    const rAvg=rest.length?rest.reduce((s,k)=>s+(scores[k]??0),0)/rest.length:0;
    if(dAvg<=rAvg)return false;
  }
  return true;
}
function assignProfile(kpis,scores,traits){
  const cands=[];
  for(const p of PROFILES)for(const r of p.rules)cands.push({p,r});
  cands.sort((a,b)=>a.r.pr-b.r.pr);
  for(const {p,r} of cands)if(ruleMatches(r,kpis,scores,traits))return p.k;
  let top="enterprise_judgment",tv=-Infinity;
  for(const k in scores)if(scores[k]>tv){tv=scores[k];top=k}
  return{enterprise_judgment:"enterprise_catalyst",decision_velocity_with_discipline:"disciplined_accelerator",
    financial_strategic_acumen:"functional_optimizer",technology_data_leadership:"data_enabled_builder",
    talent_leadership:"talent_blind_spot",communication_alignment:"strategic_communicator",
    continuous_improvement_orientation:"cautious_operator"}[top]||"cautious_operator";
}

  for(let n=1;n<=upTo;n++)if(!S.rounds[n]){S.rounds[n]=JSON.parse(JSON.stringify(EXEMPLAR[n]));usedExemplar=true}
  save();

/* Compute snapshot chain from whatever rounds are submitted */
function snapshots(){
  const chain=[{label:"Baseline",K:initKPIs(),S:initScores()}];
  let K=initKPIs(),Sc=initScores(),T=[];
  for(let n=1;n<=3;n++){
    if(!S.rounds[n])break;
    const r=applyRound(ROUNDS[n-1],S.rounds[n],K,Sc);
    K=r.K;Sc=r.S;T=T.concat(r.T);
    chain.push({label:"Round "+n,K:{...K},S:{...Sc}});
  }
  return{chain,K,S:Sc,T};
}

const BASE_DONE=17,BASE_INPROG=4,BASE_NOTSTART=2;
/* deterministic pseudo-random option counts for the decision-pattern view */
function patternCounts(decision){
  const w=[6,5,3,2,1],n=decision.opts.length;
  const totalPicks=decision.type==="multi"?BASE_DONE*(decision.min===decision.max?decision.min:2):BASE_DONE;
  let raw=decision.opts.map((o,i)=>w[(i+decision.k.length)%w.length]);
  const sum=raw.reduce((a,b)=>a+b,0);
  let counts=raw.map(x=>Math.round(x/sum*totalPicks));
  let diff=totalPicks-counts.reduce((a,b)=>a+b,0);
  counts[0]+=diff;
  return counts;
}

if(!S.draft)S.draft={};
function draftFor(n){
  if(!S.draft[n]){
    const d={};
    ROUNDS[n-1].decisions.forEach(dec=>{
      if(dec.type==="alloc"){
        const each=Math.floor(100/dec.opts.length),rem=100-each*dec.opts.length,a={};
        dec.opts.forEach((o,i)=>a[o.k]=each+(i===0?rem:0));
        d[dec.k]={sel:dec.opts.map(o=>o.k),alloc:a};
      }else d[dec.k]={sel:[]};
    });
    S.draft[n]=d;
  }
  return S.draft[n];
}

        <div class="grid2" style="gap:20px">
          <div><b style="font-size:15px;color:var(--navy)">Profile: ${esc(me.profile.l)}</b>
            <p style="font-size:13.5px;color:var(--t2);line-height:1.6;margin:6px 0 0">${esc(me.profile.d)}</p></div>
          <div><b style="font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.05em">Final KPIs</b>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums">
            ${KPIS.map(k=>`<div style="display:flex;justify-content:space-between"><span style="color:var(--t2)">${esc(k.l)}</span><b style="color:var(--navy)">${Math.round(me.K[k.k])}</b></div>`).join("")}</div></div></div>
        <div style="border-top:1px solid var(--border);margin-top:18px;padding-top:16px">
          <b style="font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.05em">Executive recommendation (excerpt)</b>
          <p style="font-size:14px;color:var(--t2);font-style:italic;line-height:1.6;margin:8px 0 0">“${esc((S.rec.prioritizedStrategy||"").slice(0,220))}${(S.rec.prioritizedStrategy||"").length>220?"…":""}”</p></div>
      </div>`:""}
      <div class="card scrollx"><table style="min-width:640px">
        <thead><tr><th scope="col">Participant</th><th scope="col">Status</th><th scope="col">Profile</th><th scope="col">Report</th></tr></thead>
        <tbody>${rows.map(r=>`<tr style="${r.me?"background:#FDF4F5":""}">
          <td>${esc(r.nm)}${r.me?'<span class="youchip">YOU</span>':""}</td>
          <td style="font-weight:500"><span style="font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;${r.status==="Completed"?"background:#DCF3E6;color:#166534":r.status==="In Progress"?"background:#E0EAFF;color:#1D4ED8":"background:#F0F0F5;color:#6B7280"}">${r.status}</span></td>
          <td style="font-weight:500">${esc(r.prof)}</td>
          <td style="font-weight:500;color:var(--t3)">${r.status==="Completed"?"View · PDF":"—"}</td></tr>`).join("")}</tbody></table></div>
      ${note("In production each row links to a participant detail page — KPI trajectory, all twelve selections with rationale, recommendation answers, and the printable report. The 23 names here are fabricated; only the highlighted row is real (it's your walkthrough run). <b>End of walkthrough.</b> Use <b>Screens ▾</b> to revisit anything, or ↺ Restart to play a different leadership style and watch your profile change.","Participant drill-down · end of tour")}
    </div></div>`;
}

/* ════════════════════════════════════════════════════════════════════════
   NAVIGATION / BOOT
   ════════════════════════════════════════════════════════════════════════ */
const SCREENS=[
 {t:"Welcome",act:"Start",render:renderCover,need:0},
 {t:"Sign in (magic link)",act:"Act I · Participant",render:renderLogin,need:0},
 {t:"Orientation & self-assessment",act:"Act I · Participant",render:renderOrientation,need:0},
 {t:"Round 1 — Set Direction",act:"Act I · Participant",render:()=>renderRound(1),need:0},
 {t:"Round 1 — Consequences",act:"Act I · Participant",render:()=>renderConseq(1),need:1},
 {t:"Round 2 — Disruption",act:"Act I · Participant",render:()=>renderRound(2),need:1},
 {t:"Round 2 — Consequences",act:"Act I · Participant",render:()=>renderConseq(2),need:2},
 {t:"Round 3 — AI Inflection",act:"Act I · Participant",render:()=>renderRound(3),need:2},
 {t:"Round 3 — Consequences",act:"Act I · Participant",render:()=>renderConseq(3),need:3},
 {t:"Executive Recommendation",act:"Act I · Participant",render:renderRec,need:3},
 {t:"Performance Dashboard",act:"Act I · Participant",render:renderDashboard,need:3},
 {t:"Completion",act:"Act I · Participant",render:renderComplete,need:3,needRec:true},
 {t:"Faculty — Cohort Dashboard",act:"Act II · Faculty",render:renderFacDash,need:0},
 {t:"Faculty — Participants",act:"Act II · Faculty",render:renderFacParticipants,need:0},
 {t:"Faculty — Decision Patterns",act:"Act II · Faculty",render:renderFacPatterns,need:0}];

const stage=document.getElementById("stage"),barMid=document.getElementById("barMid"),
  drawer=document.getElementById("drawer"),prevBtn=document.getElementById("prevBtn"),
  nextBtn=document.getElementById("nextBtn");

function fillExemplarRec(){
  if(S.recDone)return;
  S.rec={prioritizedStrategy:"[Exemplar] Stabilize compliance posture and the leadership bench first; fund digital acceleration from a position of regulatory strength.",
   actionPlan90Day:"[Exemplar] 1) Close both non-conformances before the audit window. 2) Confirm the HOO transition path and backfill plan. 3) Stand up lean AI governance and launch the limited pilot.",
   keyRisks:"[Exemplar] Audit escalation (mitigate via proactive regulator engagement) and leadership attrition (mitigate via retention paths and interim coverage).",
   talentImplications:"[Exemplar] Retain the Head of Operations on a defined path; promote one high-potential; begin upskilling 500 operators ahead of AI deployment.",
   communicationApproach:"[Exemplar] Transparent all-hands cadence: name the challenges, publish the 90-day plan, report progress against it every two weeks."};
  S.recDone=true;
}
function goto(i,skipFill){
  i=Math.max(0,Math.min(SCREENS.length-1,i));
  const scr=SCREENS[i];
  usedExemplar=false;
  if(!skipFill){
    if(scr.need)ensureRounds(scr.need);
    if(scr.needRec||i>=12)if(scr.need||i>=12){if(i===11||i>=12){if(!S.recDone&&S.rounds[3]&&i===11)fillExemplarRec();}}
  }
  S.screen=i;save();
  rvErrorsClear();
  render();
  window.scrollTo({top:0});
}
function rvErrorsClear(){for(const k in rvErrors)delete rvErrors[k]}
function render(){
  const i=S.screen,scr=SCREENS[i];
  document.body.classList.toggle("notes",!!S.notes);
  document.getElementById("notesBtn").setAttribute("aria-pressed",S.notes?"true":"false");
  barMid.innerHTML=`Screen ${i+1} of ${SCREENS.length} · <strong>${esc(scr.t)}</strong> · ${esc(scr.act)}`;
  let html=scr.render();
  if(usedExemplar){
    html=`<div style="max-width:880px;margin:14px auto -6px;padding:0 24px">
      <div style="background:var(--c-note-bg);border:1px solid var(--c-note-line);color:var(--c-note-fg);border-radius:10px;padding:10px 14px;font-size:13px">
      ↷ You jumped ahead — skipped rounds were auto-filled with a neutral <b>exemplar path</b> so this screen has data. Use ↺ Restart to play them yourself.</div></div>`+html;
  }
  stage.innerHTML=html;
  prevBtn.disabled=i===0;
  nextBtn.disabled=i===SCREENS.length-1;
  nextBtn.textContent=i===SCREENS.length-1?"End of walkthrough":"Continue →";
  wire();
  buildDrawer();
}
function buildDrawer(){
  let html="";let lastAct="";
  SCREENS.forEach((s,i)=>{
    if(s.act!==lastAct){html+=`<h3>${esc(s.act)}</h3>`;lastAct=s.act}
    html+=`<button class="jump" data-jump="${i}" aria-current="${i===S.screen}"><span class="num">${i+1}</span> ${esc(s.t)}</button>`;
  });
  drawer.innerHTML=html;
  drawer.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{
    drawer.classList.remove("open");document.getElementById("menuBtn").setAttribute("aria-expanded","false");
    goto(+b.dataset.jump);
  }));
}
/* validation + submit actions */
function submitRound(n){
  const R=ROUNDS[n-1],d=draftFor(n);
  rvErrorsClear();let ok=true;
  for(const dec of R.decisions){
    const s=d[dec.k];
    if(dec.type==="single"&&s.sel.length!==1){rvErrors[dec.k]="Please select one option.";ok=false}
    else if(dec.type==="multi"){
      const min=dec.min||1,max=dec.max||dec.opts.length,c=s.sel.length;
      if(c<min||c>max){rvErrors[dec.k]=min===max?`Please select exactly ${min} option${min!==1?"s":""}.`:`Please select between ${min} and ${max} options.`;ok=false}
    }else if(dec.type==="alloc"){
      const tot=Object.values(s.alloc).reduce((a,b)=>a+(b||0),0);
      if(tot!==100){rvErrors[dec.k]=`Allocation must total 100%. Currently: ${tot}%.`;ok=false}
    }
  }
  if(!ok){render();
    const first=document.querySelector(".dsec.bad h3");if(first)first.focus();
    return;}
  S.rounds[n]=JSON.parse(JSON.stringify(d));save();
  goto(S.screen+1,true);
}
function wire(){
  stage.querySelectorAll("[data-act]").forEach(el=>el.addEventListener("click",e=>{
    const a=el.dataset.act;
    if(a==="next")goto(S.screen+1);
    else if(a==="begin"){
      if(!S.sa.q1||!S.sa.q2||!S.sa.q3){const er=document.getElementById("saErr");if(er){er.style.display="block";er.scrollIntoView({block:"center"})}return}
      goto(S.screen+1,true);
    }
    else if(a==="submitRound")submitRound(+el.dataset.round);
    else if(a==="submitRec"){
      let ok=true;
      REC_FIELDS.forEach(f=>{
        const bad=!(S.rec[f[0]]||"").trim();
        const er=stage.querySelector(`[data-recerr="${f[0]}"]`);
        if(er)er.style.display=bad?"block":"none";
        if(bad)ok=false;
      });
      if(!ok)return;
      S.recDone=true;save();goto(S.screen+1,true);
    }
  }));
  stage.querySelectorAll("input[type=radio][name^=sa_]").forEach(el=>el.addEventListener("change",()=>{
    S.sa[el.name.replace("sa_","")]=el.value;save();
  }));
  const q4=document.getElementById("sa_q4");if(q4)q4.addEventListener("input",()=>{S.sa.q4=q4.value;save()});
  stage.querySelectorAll("input[data-dec][data-type]").forEach(el=>el.addEventListener("change",()=>{
    const n=+SCREENS[S.screen].t.match(/Round (\d)/)[1];
    const d=draftFor(n),dec=ROUNDS[n-1].decisions.find(x=>x.k===el.dataset.dec),s=d[dec.k];
    if(el.dataset.type==="single")s.sel=[el.value];
    else{
      if(el.checked){if(!s.sel.includes(el.value))s.sel.push(el.value);
        const max=dec.max||dec.opts.length;
        if(s.sel.length>max){s.sel=s.sel.filter(k=>k!==el.value);el.checked=false;return}
      }else s.sel=s.sel.filter(k=>k!==el.value);
    }
    delete rvErrors[dec.k];save();render();
  }));
  stage.querySelectorAll("input[data-alloc]").forEach(el=>el.addEventListener("change",()=>{
    const n=+SCREENS[S.screen].t.match(/Round (\d)/)[1];
    const d=draftFor(n),s=d[el.dataset.dec];
    let v=parseInt(el.value,10);v=isNaN(v)?0:Math.min(100,Math.max(0,v));
    s.alloc[el.dataset.alloc]=v;delete rvErrors[el.dataset.dec];save();render();
  }));
  stage.querySelectorAll("textarea[data-rec]").forEach(el=>el.addEventListener("input",()=>{
    S.rec[el.dataset.rec]=el.value;save();
  }));
  stage.querySelectorAll("[data-fac]").forEach(el=>el.addEventListener("click",e=>{
    e.preventDefault();goto(12+[0,1,2][+el.dataset.fac]);
  }));
}
document.getElementById("notesBtn").addEventListener("click",()=>{S.notes=!S.notes;save();render()});
document.getElementById("menuBtn").addEventListener("click",()=>{
  const open=drawer.classList.toggle("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded",open?"true":"false");
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("Clear all your choices and restart the walkthrough?"))return;
  localStorage.removeItem(LS);
  S={screen:0,notes:S.notes,sa:{q1:null,q2:null,q3:null,q4:""},rounds:{1:null,2:null,3:null},
    rec:{prioritizedStrategy:"",actionPlan90Day:"",keyRisks:"",talentImplications:"",communicationApproach:""},
    recDone:false,draft:{}};
  save();goto(0,true);
});
prevBtn.addEventListener("click",()=>goto(S.screen-1,true));
nextBtn.addEventListener("click",()=>{
  const i=S.screen;
  /* screens that gate forward progress on their own submit */
  if(i===2){document.querySelector('[data-act="begin"]').click();return}
  if(i===3||i===5||i===7){submitRound(i===3?1:i===5?2:3);return}
  if(i===9){document.querySelector('[data-act="submitRec"]').click();return}
  goto(i+1);
});
goto(S.screen,true);
</script>
